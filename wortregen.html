<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wortregen V0.1 · Mưa Từ Vựng tiếng Đức (VokabelGo)</title>
  <link rel="stylesheet" href="wortregen.css">
</head>
<body>
  <div class="wortregen-app" id="wortregen-app">
    <!-- Header with Branding & HUD -->
    <header class="wortregen-header">
      <div class="header-top-row">
        <div class="brand-section">
          <span class="brand-badge">VokabelGo Mini-Game</span>
          <h1 class="brand-title">Wortregen</h1>
        </div>

        <!-- Mute/Unmute Button -->
        <button class="btn-icon-sound" id="btn-mute" type="button" aria-label="Bật/Tắt âm thanh" title="Âm thanh">
          <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- HUD Stats -->
      <div class="hud-bar">
        <!-- Combo Pill -->
        <div class="hud-pill hud-combo" id="hud-combo">Combo x0</div>

        <!-- Score Pill -->
        <div class="hud-pill hud-score">
          <span class="hud-score-label">Điểm</span>
          <span class="hud-score-value" id="hud-score-val">0</span>
        </div>

        <!-- Lives Pill -->
        <div class="hud-pill hud-lives" id="hud-lives" aria-label="3 mạng">
          <span class="hud-heart">❤️</span>
          <span class="hud-heart">❤️</span>
          <span class="hud-heart">❤️</span>
        </div>
      </div>
    </header>

    <!-- Main Game Viewport -->
    <main class="game-viewport">
      <div class="game-board">
        <!-- Falling Words Zone -->
        <div class="falling-area" id="falling-area">
          <!-- Threshold line indicating ground contact -->
          <div class="ground-threshold">Vùng chạm đất</div>
        </div>

        <!-- Fixed Bottom Input Dock -->
        <form class="input-dock" id="input-dock" autocomplete="off">
          <div class="input-container">
            <input 
              type="text" 
              id="word-input" 
              class="word-input" 
              placeholder="Gõ tiếng Đức..." 
              autocomplete="off" 
              autocorrect="off" 
              autocapitalize="none" 
              spellcheck="false"
            />
          </div>
          <button type="submit" class="btn-submit" id="btn-submit" aria-label="Nộp đáp án">
            <span>Enter</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 10 4 15 9 20"></polyline>
              <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
            </svg>
          </button>
        </form>

        <!-- Start Overlay Screen -->
        <div class="overlay-screen" id="start-screen">
          <div class="overlay-card">
            <div class="overlay-icon">🌧️ 📖</div>
            <h2 class="overlay-title accent">Wortregen</h2>
            <p class="overlay-instruction">
              Gõ từ tiếng Đức trước khi từ rơi xuống!
            </p>
            <p class="overlay-tip">
              💡 Nhấn Enter để bắn rơi từ. Giữ nhịp đúng liên tiếp để tích Combo!
            </p>
            <button class="btn-primary" id="btn-start" type="button">
              <span>Bắt đầu</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
          </div>
        </div>

        <!-- Game Over Overlay Screen -->
        <div class="overlay-screen hidden" id="game-over-screen">
          <div class="overlay-card">
            <div class="overlay-icon">🏁 💧</div>
            <h2 class="overlay-title">Wortregen beendet!</h2>
            
            <div class="stats-list">
              <div class="stat-item">
                <span class="stat-item-label">
                  <span>🏆</span> Điểm
                </span>
                <span class="stat-item-val highlight" id="summary-score">0</span>
              </div>
              <div class="stat-item">
                <span class="stat-item-label">
                  <span>✨</span> Số từ trả lời đúng
                </span>
                <span class="stat-item-val" id="summary-solved">0</span>
              </div>
              <div class="stat-item">
                <span class="stat-item-label">
                  <span>💧</span> Số từ bị rơi mất
                </span>
                <span class="stat-item-val" id="summary-missed">0</span>
              </div>
              <div class="stat-item">
                <span class="stat-item-label">
                  <span>🔥</span> Combo cao nhất
                </span>
                <span class="stat-item-val highlight" id="summary-combo">x0</span>
              </div>
            </div>

            <button class="btn-primary" id="btn-replay" type="button">
              <span>Chơi lại</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="wortregen.js"></script>
</body>
</html>
