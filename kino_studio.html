        }
        if(saved){
          const parsed = JSON.parse(saved);
          if(Array.isArray(parsed) && parsed.length > 0){
            SEGMENTS = parsed;
          }
        }
      } catch(e){}

      // Specific auto-restore for pizzaschwester if gap exists
        if(currentVideoKey === 'peppa_supermarkt'){
          localStorage.setItem('vokabelgo_kino_perfected_peppa_supermarkt', JSON.stringify(SEGMENTS));
        }
        if(currentVideoKey === 'pizzaschwester'){
        for(let i = 0; i < SEGMENTS.length - 1; i++){
          const s1 = SEGMENTS[i];
          const s2 = SEGMENTS[i+1];
          if(s1.end >= 218.0 && s1.end <= 225.0 && s2.start >= 240.0){
            const restored = {
              id: s1.id + 1,
              start: Math.round(s1.end * 100) / 100,
              end: Math.round(s2.start * 100) / 100,
              text: "Wuhuhu! Ich fahr lieber.",
              vi: "Wuhuhu! Tôi thích lái xe hơn.",
              _restored: true
            };
            SEGMENTS.splice(i + 1, 0, restored);
            SEGMENTS.forEach((item, idx) => item.id = idx + 1);
            saveLocalDraft();
            break;
          }
        }
      }

      undoStack = [];
      redoStack = [];
      trashBin = [];
      activeIdx = 0;
      updateHistoryUI();
      renderList();
      selectSegment(0, false);
    }

    function pushHistory(){
      undoStack.push(JSON.stringify(SEGMENTS));
      if(undoStack.length > 30) undoStack.shift();
      redoStack = [];
      updateHistoryUI();
    }

    function undoAction(){
      if(undoStack.length === 0) return;
      redoStack.push(JSON.stringify(SEGMENTS));
      SEGMENTS = JSON.parse(undoStack.pop());
      saveLocalDraft();
      renderList();
      selectSegment(activeIdx, false);
      updateHistoryUI();
    }

    function redoAction(){
      if(redoStack.length === 0) return;
      undoStack.push(JSON.stringify(SEGMENTS));
      SEGMENTS = JSON.parse(redoStack.pop());
      saveLocalDraft();
      renderList();
      selectSegment(activeIdx, false);
      updateHistoryUI();
    }

    function updateHistoryUI(){
      const btnUndo = document.getElementById('btnUndo');
      const btnRedo = document.getElementById('btnRedo');
      const info = document.getElementById('historyStepInfo');
      if(btnUndo) btnUndo.disabled = (undoStack.length === 0);
      if(btnRedo) btnRedo.disabled = (redoStack.length === 0);
      if(info) info.textContent = `Hoàn tác: ${undoStack.length} bước`;
    }

    function renderList(){
      const container = document.getElementById('segList');
      container.innerHTML = '';
      let overlapCount = 0;

      SEGMENTS.forEach((s, idx) => {
        const isCur = (idx === activeIdx);
        const dur = (s.end - s.start).toFixed(2);

        let isOverlap = false;
        if(idx < SEGMENTS.length - 1){
          const nxt = SEGMENTS[idx + 1];
          if(s.end > nxt.start + 0.05){
            isOverlap = true;
            overlapCount++;
          }
        }

        const row = document.createElement('div');
        row.className = `seg-row ${isCur ? 'active' : ''}`;
        row.id = `row_${idx}`;
        row.onclick = () => selectSegment(idx, true);

        row.innerHTML = `
          <div class="seg-num">#${String(s.id).padStart(2, '0')}</div>
          <div class="seg-times">
            <span>${s.start.toFixed(2)}s</span> ➔ <span>${s.end.toFixed(2)}s</span>
            <span style="color:#9ca3af;font-size:10px;">(${dur}s)</span>
          </div>
          <div class="seg-content">
            <div class="seg-de">${s.text}</div>
            <div class="seg-vi">${s.vi || ''}</div>
          </div>
          <div class="seg-actions">
            ${isOverlap ? '<span class="status-badge overlap">⚠️ ĐÈ ÂM</span>' : ''}
            ${s._restored ? '<span class="status-badge restored">ĐÃ KHÔI PHỤC</span>' : ''}
            ${s._merged ? '<span class="status-badge merged">ĐÃ GỘP</span>' : ''}
            <button class="btn" style="background:#2563eb;color:#fff;padding:3px 7px;" onclick="event.stopPropagation(); selectSegment(${idx}, true);">
              🔊 Nghe
            </button>
          </div>
        `;
        container.appendChild(row);
      });

      const conf = VIDEO_CONFIGS[currentVideoKey];
      document.getElementById('tableTitleHeader').textContent = `📋 ${conf.title} (${SEGMENTS.length} câu)`;
      let statusStr = `Tổng: ${SEGMENTS.length} câu`;
      if(overlapCount > 0) statusStr += ` · ⚠️ Có ${overlapCount} câu đè mốc!`;
      document.getElementById('modCountInfo').textContent = statusStr;
      renderTrashUI();
    }

    function selectSegment(idx, autoPlay = false){
      if(idx < 0) idx = 0;
      if(idx >= SEGMENTS.length) idx = SEGMENTS.length - 1;
      activeIdx = idx;

      document.querySelectorAll('.seg-row').forEach((r, i) => {
        r.classList.toggle('active', i === activeIdx);
      });

      const row = document.getElementById(`row_${activeIdx}`);
      if(row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      const s = SEGMENTS[activeIdx];
      document.getElementById('curTitle').textContent = `Câu #${String(s.id).padStart(2, '0')} (Đang chọn)`;

      const deInput = document.getElementById('editDeInput');
      const viInput = document.getElementById('editViInput');
      if(deInput) deInput.value = s.text || '';
      if(viInput) viInput.value = s.vi || '';

      const elStart = document.getElementById('valStart');
      const elEnd = document.getElementById('valEnd');
      if(elStart) elStart.value = s.start.toFixed(2);
      if(elEnd) elEnd.value = s.end.toFixed(2);

      if(autoPlay){
        playCurrentSegment();
      } else {
        video.pause();
        video.currentTime = s.start;
      }
    }

    function playCurrentSegment(){
      const s = SEGMENTS[activeIdx];
      if(!s) return;

      if(timeupdateListener){
        video.removeEventListener('timeupdate', timeupdateListener);
        timeupdateListener = null;
      }

      video.currentTime = s.start;
      video.muted = false;
      const p = video.play();
      if(p) p.catch(() => {});

      timeupdateListener = function(){
        if(video.currentTime >= s.end){
          video.pause();
          video.currentTime = s.end;
          video.removeEventListener('timeupdate', timeupdateListener);
          timeupdateListener = null;
        }
      };
      video.addEventListener('timeupdate', timeupdateListener);
    }

    function pinStartTime(){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let t = Math.max(0, video.currentTime - 0.12);
      t = Math.round(t * 100) / 100;
      if(t >= s.end) t = Math.max(0, s.end - 0.3);

      s.start = t;
      const elS = document.getElementById('valStart'); if(elS) elS.value = s.start.toFixed(2);
      flashInputHighlight('valStart');
      saveLocalDraft();
      renderList();
    }

    function pinEndTime(){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let t = Math.round(video.currentTime * 100) / 100;
      if(t <= s.start) t = s.start + 0.3;

      s.end = t;
      const elE = document.getElementById('valEnd'); if(elE) elE.value = s.end.toFixed(2);
      flashInputHighlight('valEnd');
      saveLocalDraft();
      renderList();
    }

    function flashInputHighlight(elementId){
      const el = document.getElementById(elementId);
      if(!el) return;
      el.style.background = '#10b981';
      el.style.color = '#fff';
      el.style.borderRadius = '3px';
      el.style.padding = '1px 4px';
      setTimeout(() => {
        el.style.background = '';
        el.style.color = '#60a5fa';
        el.style.padding = '';
      }, 300);
    }

    function mergeWithNextSegment(){
      if(activeIdx >= SEGMENTS.length - 1){
        alert("Câu này là câu cuối cùng rồi, không có câu sau để gộp!");
        return;
      }
      pushHistory();
      const cur = SEGMENTS[activeIdx];
      const next = SEGMENTS[activeIdx + 1];

      cur.end = next.end;
      cur.text = (cur.text.trim() + " " + next.text.trim()).trim();
      cur.vi = ((cur.vi || "").trim() + " " + (next.vi || "").trim()).trim();
      cur._merged = true;

      SEGMENTS.splice(activeIdx + 1, 1);
      SEGMENTS.forEach((item, i) => item.id = i + 1);

      saveLocalDraft();
      renderList();
      selectSegment(activeIdx, true);
    }

    function splitAtCurrentVideoTime(){
      const s = SEGMENTS[activeIdx];
      const splitTime = Math.round(video.currentTime * 100) / 100;

      if(splitTime <= s.start + 0.4 || splitTime >= s.end - 0.4){
        alert(`Vị trí video (${splitTime}s) phải nằm ở khoảng giữa của câu (${s.start}s ➔ ${s.end}s) để tách!`);
        return;
      }

      pushHistory();
      const origEnd = s.end;
      s.end = splitTime;

      const newSeg = {
        id: activeIdx + 2,
        start: splitTime,
        end: origEnd,
        text: "[Nửa sau câu vừa tách]",
        vi: "[Bản dịch nửa sau]"
      };

      SEGMENTS.splice(activeIdx + 1, 0, newSeg);
      SEGMENTS.forEach((item, i) => item.id = i + 1);

      saveLocalDraft();
      renderList();
      selectSegment(activeIdx, true);
    }

    function insertSegmentAfter(){
      pushHistory();
      const cur = SEGMENTS[activeIdx];
      const newStart = Math.round((cur.end + 0.1) * 100) / 100;
      const newEnd = Math.round((newStart + 3.0) * 100) / 100;

      const newSeg = {
        id: activeIdx + 2,
        start: newStart,
        end: newEnd,
        text: "Câu thoại tiếng Đức mới...",
        vi: "Bản dịch nghĩa tiếng Việt..."
      };

      SEGMENTS.splice(activeIdx + 1, 0, newSeg);
      SEGMENTS.forEach((item, i) => item.id = i + 1);

      saveLocalDraft();
      renderList();
      selectSegment(activeIdx + 1, true);

      const deInput = document.getElementById('editDeInput');
      if(deInput){ deInput.focus(); deInput.select(); }
    }

    function deleteCurrentSegment(){
      if(SEGMENTS.length <= 1){
        alert("Không thể xóa câu duy nhất còn lại!");
        return;
      }
      pushHistory();
      const s = SEGMENTS[activeIdx];
      trashBin.push({ item: JSON.parse(JSON.stringify(s)), originalIndex: activeIdx });

      SEGMENTS.splice(activeIdx, 1);
      SEGMENTS.forEach((item, i) => item.id = i + 1);

      if(activeIdx >= SEGMENTS.length) activeIdx = SEGMENTS.length - 1;
      saveLocalDraft();
      renderList();
      selectSegment(activeIdx, false);
    }

    function restoreFromTrash(trashIdx){
      const entry = trashBin[trashIdx];
      if(!entry) return;
      pushHistory();
      const insertAt = Math.min(entry.originalIndex, SEGMENTS.length);
      SEGMENTS.splice(insertAt, 0, entry.item);
      SEGMENTS.forEach((item, i) => item.id = i + 1);
      trashBin.splice(trashIdx, 1);

      saveLocalDraft();
      renderList();
      selectSegment(insertAt, true);
    }

    function renderTrashUI(){
      const box = document.getElementById('trashBox');
      const list = document.getElementById('trashList');
      if(trashBin.length === 0){
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      list.innerHTML = '';
      trashBin.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'trash-item';
        div.innerHTML = `
          <span>#${t.item.id} (${t.item.start}s-${t.item.end}s): ${t.item.text.slice(0, 20)}...</span>
          <button class="btn" style="background:#059669;color:#fff;padding:2px 6px;" onclick="restoreFromTrash(${i})">♻️ Khôi phục</button>
        `;
        list.appendChild(div);
      });
    }

    function clearTrash(){
      trashBin = [];
      renderTrashUI();
    }

    function onDeTextChange(val){
      const s = SEGMENTS[activeIdx];
      if(!s) return;
      s.text = val;
      saveLocalDraft();
      const curRow = document.getElementById(`row_${activeIdx}`);
      if(curRow){
        const deEl = curRow.querySelector('.seg-de');
        if(deEl) deEl.textContent = val;
      }
    }

    function onViTextChange(val){
      const s = SEGMENTS[activeIdx];
      if(!s) return;
      s.vi = val;
      saveLocalDraft();
      const curRow = document.getElementById(`row_${activeIdx}`);
      if(curRow){
        const viEl = curRow.querySelector('.seg-vi');
        if(viEl) viEl.textContent = val;
      }
    }

    function onManualStartChange(valStr){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let val = parseFloat(valStr);
      if(isNaN(val)) val = s.start;
      val = Math.round(val * 100) / 100;
      if(val < 0) val = 0;
      if(val >= s.end - 0.2) val = Math.max(0, Math.round((s.end - 0.2) * 100) / 100);

      s.start = val;
      const el = document.getElementById('valStart');
      if(el) el.value = s.start.toFixed(2);
      saveLocalDraft();
      renderList();
      playCurrentSegment();
    }

    function onManualEndChange(valStr){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let val = parseFloat(valStr);
      if(isNaN(val)) val = s.end;
      val = Math.round(val * 100) / 100;
      if(val <= s.start + 0.2) val = Math.round((s.start + 0.2) * 100) / 100;

      s.end = val;
      const el = document.getElementById('valEnd');
      if(el) el.value = s.end.toFixed(2);
      saveLocalDraft();
      renderList();
      playCurrentSegment();
    }

    function nudgeStart(delta){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let newStart = Math.round((s.start + delta) * 100) / 100;
      if(newStart < 0) newStart = 0;
      if(newStart >= s.end - 0.3) newStart = Math.round((s.end - 0.3) * 100) / 100;

      s.start = newStart;
      const elS = document.getElementById('valStart'); if(elS) elS.value = s.start.toFixed(2);
      saveLocalDraft();
      renderList();
      playCurrentSegment();
    }

    function nudgeEnd(delta){
      pushHistory();
      const s = SEGMENTS[activeIdx];
      let newEnd = Math.round((s.end + delta) * 100) / 100;
      if(newEnd <= s.start + 0.3) newEnd = Math.round((s.start + 0.3) * 100) / 100;

      s.end = newEnd;
      const elE = document.getElementById('valEnd'); if(elE) elE.value = s.end.toFixed(2);
      saveLocalDraft();
      renderList();
      playCurrentSegment();
    }

    function resetToDefaultSegments(){
      const conf = VIDEO_CONFIGS[currentVideoKey];
      if(confirm(`Bạn có muốn tải lại toàn bộ mốc thời gian chuẩn gốc (${conf.defaultSegs.length} câu) của "${conf.title}" không?`)){
        pushHistory();
        SEGMENTS = JSON.parse(JSON.stringify(conf.defaultSegs));
        saveLocalDraft();
        renderList();
        selectSegment(0, false);
        alert(`✅ Đã tải lại toàn bộ mốc thời gian chuẩn gốc của "${conf.title}"!`);
      }
    }

    function saveLocalDraft(){
      try {
        const conf = VIDEO_CONFIGS[currentVideoKey];
        localStorage.setItem(conf.storageKey, JSON.stringify(SEGMENTS));
      } catch(e){}
    }

    function saveAndSyncAll(){
      saveLocalDraft();
      const conf = VIDEO_CONFIGS[currentVideoKey];
      try {
        localStorage.setItem('vokabelgo_kino_perfected_' + currentVideoKey, JSON.stringify(SEGMENTS));
        if(currentVideoKey === 'peppa_supermarkt'){
          localStorage.setItem('vokabelgo_kino_perfected_peppa_supermarkt', JSON.stringify(SEGMENTS));
        }
        if(currentVideoKey === 'pizzaschwester'){
          localStorage.setItem('vokabelgo_kino_perfected_segments_v2', JSON.stringify(SEGMENTS));
        }
      } catch(e){}
      alert(`🎉 Đã lưu và đồng bộ thành công ${SEGMENTS.length} câu của "${conf.title}" sang Web chính!\n\nWeb chính sẽ tự động cập nhật ngay lập tức!`);
    }

    function exportJsonFile(){
      const conf = VIDEO_CONFIGS[currentVideoKey];
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(SEGMENTS, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", conf.jsonFile);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    // KEYBOARD SHORTCUTS
    window.addEventListener('keydown', (e) => {
      const isInputFocused = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
        e.preventDefault();
        undoAction();
        return;
      }
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
        e.preventDefault();
        redoAction();
        return;
      }

      if(!isInputFocused){
        if(e.code === 'Space'){
          e.preventDefault();
          playCurrentSegment();
        } else if(e.key.toLowerCase() === 's'){
          e.preventDefault();
          pinStartTime();
        } else if(e.key.toLowerCase() === 'e'){
          e.preventDefault();
          pinEndTime();
        } else if(e.key === 'ArrowDown'){
          e.preventDefault();
          selectSegment(activeIdx + 1, true);
        } else if(e.key === 'ArrowUp'){
          e.preventDefault();
          selectSegment(activeIdx - 1, true);
        } else if(e.key === '['){
          e.preventDefault();
          nudgeStart(-0.1);
        } else if(e.key === ']'){
          e.preventDefault();
          nudgeStart(0.1);
        }
      }
    });

    // Initialize with last active video or default to pizzaschwester
    let initStudioKey = 'pizzaschwester';
    try {
      const savedStudioKey = localStorage.getItem('kino_studio_active_video');
      if(savedStudioKey && VIDEO_CONFIGS[savedStudioKey]) initStudioKey = savedStudioKey;
    } catch(e){}
    changeActiveVideo(initStudioKey);
  </script>
</body>
</html>
